[project]
name = "generative-ai"
version = "0.1.0"
description = "Hands-on learning projects for LangChain, LangGraph, RAG, MCP, agents, and LLM evaluation"
readme = "README.md"
authors = [
    { name = "Saimtec", email = "203409045+saimtec@users.noreply.github.com~" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-ollama>=0.3.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.0.0",
    "langsmith>=0.4.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.65.0",
    "sentence-transformers>=6.3.0",
    "chromadb>=1.5.9",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "comm>=0.2.3",
    "ipykernel>=7.4.0",
    "jupyter-client>=8.10.0",
    "langchain-huggingface>=1.2.3",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
]

[project.scripts]
generative-ai = "generative_ai:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
